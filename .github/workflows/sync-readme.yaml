name: Sync README versions
run-name: "📝 Sync README formula versions #${{ github.run_number }}"

on:
  push:
    branches:
      - main
    paths:
      - 'Formula/*.rb'
  workflow_dispatch:

jobs:
  sync-readme:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update README versions
        run: |
          for formula in Formula/*.rb; do
            name=$(basename "$formula" .rb)
            version=$(grep -m1 '^  version ' "$formula" | sed 's/.*"\(.*\)".*/\1/')
            sed -i "s#\(Formula/${name}\.rb) | \)[0-9][0-9.]*#\1${version}#" README.md
          done

      - name: Commit changes
        run: |
          git diff --quiet README.md && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "bump(readme): sync formula versions"
          git push
